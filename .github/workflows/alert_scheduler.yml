name: Scheduled Food Alert OSINT

on:
  schedule:
    # JALAN SETIAP 3 JAM AUTOMATIK
    - cron: '0 */3 * * *'
  workflow_dispatch: # Boleh tekan butang manual bila-bila masa

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Alert Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.8975926079:AAE1XKNGQTHasdFKr1meRtwT_HDO2gp675s }}
          TELEGRAM_CHAT_ID: ${{ secrets.-1004433036270 }}
        run: python food_alert_bot.py
